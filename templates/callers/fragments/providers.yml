# Caller source: render with scripts/render-product-workflows.py before adoption.
aws:
  if:
    $ref: shared.provider-condition
  uses: jumahamdan/github-actions/.github/workflows/v2-aws.yml@@@LIBRARY_SHA@@
  with:
    $merge:
    - $ref: shared.provider-with
    - $ref: shared.candidate-with
    - aws-role: ${{ vars.@@VARIABLE_PREFIX@@_AWS_ROLE_ARN }}
      aws-region: ${{ vars.@@VARIABLE_PREFIX@@_AWS_REGION }}
firebase:
  if:
    $ref: shared.provider-condition
  uses: jumahamdan/github-actions/.github/workflows/v2-firebase.yml@@@LIBRARY_SHA@@
  with:
    $merge:
    - $ref: shared.provider-with
    - $ref: shared.candidate-with
    - google-workload-identity-provider: ${{ vars.@@VARIABLE_PREFIX@@_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      google-service-account: ${{ vars.@@VARIABLE_PREFIX@@_GOOGLE_SERVICE_ACCOUNT }}
cloudflare:
  if:
    $ref: shared.provider-condition
  uses: jumahamdan/github-actions/.github/workflows/v2-web-deploy.yml@@@LIBRARY_SHA@@
  with:
    $merge:
    - $ref: shared.provider-with
    - $ref: shared.candidate-with
    - prior-deployment: ${{ inputs.prior_deployment }}
  secrets:
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
vercel:
  if:
    $ref: shared.provider-condition
  uses: jumahamdan/github-actions/.github/workflows/v2-web-deploy.yml@@@LIBRARY_SHA@@
  with:
    $merge:
    - $ref: shared.provider-with
    - $ref: shared.candidate-with
    - prior-deployment: ${{ inputs.prior_deployment }}
  secrets:
    VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
netlify:
  if:
    $ref: shared.provider-condition
  uses: jumahamdan/github-actions/.github/workflows/v2-web-deploy.yml@@@LIBRARY_SHA@@
  with:
    $merge:
    - $ref: shared.provider-with
    - $ref: shared.candidate-with
    - prior-deployment: ${{ inputs.prior_deployment }}
  secrets:
    NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
