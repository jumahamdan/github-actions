name: Verified candidate transport
description: Package declared candidate files or authenticate and import a producing run artifact.
inputs:
  operation:
    description: fetch or package
    required: true
  root:
    description: Caller root relative to workspace
    default: .
  manifest:
    description: Candidate manifest path for packaging
    default: ''
  run-id:
    description: Authenticated producer run ID
    default: ''
  run-attempt:
    description: Authenticated producer run attempt
    default: '1'
  artifact-name:
    description: Selected producer artifact name
    default: ''
  workflow:
    description: Trusted producer workflow path
    default: ''
  source-sha:
    description: Selected candidate source commit
    default: ''
  identity:
    description: Selected candidate identity
    default: ''
  producer-job:
    description: Completed producer job name for same-run transfer
    default: ''
  allowed-branches:
    description: Required JSON array of producer branch names for fetch, e.g. ["staging"]
    default: '[]'
  run-head-sha:
    description: Producer REST run head; PR head is distinct from tested merge source
    default: ''
  allowed-events:
    description: Explicit producer events; release producers must be push or workflow_dispatch
    default: '["push","workflow_dispatch"]'
outputs:
  directory:
    description: Allowlisted packaged candidate directory
    value: ${{ steps.transport.outputs.directory }}
  manifest:
    description: Verified manifest path relative to caller root
    value: ${{ steps.transport.outputs.manifest }}
  candidate-identity:
    description: Verified immutable candidate identity
    value: ${{ steps.transport.outputs.candidate-identity }}
  source-sha:
    description: Verified original candidate source revision
    value: ${{ steps.transport.outputs.source-sha }}
runs:
  using: composite
  steps:
  - id: transport
    shell: bash
    env:
      LIBRARY_ACTION_PATH: ${{ github.action_path }}
      TRANSPORT_OPERATION: ${{ inputs.operation }}
      TRANSPORT_ROOT: ${{ inputs.root }}
      TRANSPORT_MANIFEST: ${{ inputs.manifest }}
      TRANSPORT_RUN_ID: ${{ inputs.run-id }}
      TRANSPORT_RUN_ATTEMPT: ${{ inputs.run-attempt }}
      TRANSPORT_NAME: ${{ inputs.artifact-name }}
      TRANSPORT_WORKFLOW: ${{ inputs.workflow }}
      TRANSPORT_SOURCE: ${{ inputs.source-sha }}
      TRANSPORT_IDENTITY: ${{ inputs.identity }}
      TRANSPORT_PRODUCER_JOB: ${{ inputs.producer-job }}
      TRANSPORT_ALLOWED_BRANCHES: ${{ inputs.allowed-branches }}
      TRANSPORT_RUN_HEAD_SHA: ${{ inputs.run-head-sha }}
      TRANSPORT_ALLOWED_EVENTS: ${{ inputs.allowed-events }}
    run: python3 "$LIBRARY_ACTION_PATH/../../scripts/transport-artifacts.py"
