name: Shared tool setup
description: Install checksum-locked binaries and optional lockfile-based AI tools from this action revision.
inputs:
  binary-manifest:
    description: Optional manifest path in caller workspace
    default: ''
  npm-tools:
    description: Optional caller tool directory containing package.json and package-lock.json
    default: ''
  ai-tools:
    description: Install the library-pinned Promptfoo toolchain
    default: 'false'
  python-tools:
    description: Optional hash-locked pip requirements file in caller workspace
    default: ''
  tool-bundles:
    description: 'Reviewed built-in bundles: sonar,google-sdk,bundletool,android-build-tools'
    default: ''
runs:
  using: composite
  steps:
  - name: Prepare tools from verified manifests
    shell: bash
    env:
      LIBRARY_ACTION_PATH: ${{ github.action_path }}
      BINARY_MANIFEST: ${{ inputs.binary-manifest }}
      NPM_TOOLS: ${{ inputs.npm-tools }}
      INSTALL_AI_TOOLS: ${{ inputs.ai-tools }}
      PYTHON_TOOLS: ${{ inputs.python-tools }}
      TOOL_BUNDLES: ${{ inputs.tool-bundles }}
    run: python3 "$LIBRARY_ACTION_PATH/../../scripts/setup-tools.py"
