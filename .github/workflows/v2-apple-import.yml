# Generated by scripts/generate-workflows.py; edit workflow-templates/ instead.
name: Mobile · Apple evidence import
'on':
  workflow_call:
    inputs:
      config:
        description: Configuration path relative to caller root
        required: true
        type: string
      root:
        description: Caller root relative to workspace
        required: false
        type: string
        default: .
      python-version:
        description: Exact Python version
        required: false
        type: string
        default: 3.12.3
      node-version:
        description: Exact Node version
        required: false
        type: string
        default: 22.23.4
      binary-manifest:
        description: Caller checksum manifest for extra CLI tools
        required: false
        type: string
        default: ''
      npm-tools:
        description: Caller lockfile-based CLI tool directory
        required: false
        type: string
        default: ''
      artifact-name:
        description: Unique artifact base name; actual receipt and candidate names include run/attempt
        required: true
        type: string
      python-tools:
        description: Hash-locked caller pip requirements file
        type: string
        required: false
        default: ''
      tool-bundles:
        description: Reviewed built-in tool bundles
        type: string
        required: false
        default: ''
      receipt-retention-days:
        description: Retain operation receipts and retry state for this many days
        type: number
        required: false
        default: 90
      environment:
        description: Explicit configured GitHub environment
        required: true
        type: string
      aws-role:
        description: Explicit deployment role
        required: true
        type: string
      aws-region:
        description: Explicit AWS region
        required: true
        type: string
      receipt-path:
        type: string
        description: Retained module receipt path relative to caller root
        required: false
        default: ''
      credentials-config:
        description: Named credential contract relative to caller root
        type: string
        required: true
      candidate-retention-days:
        description: Retention covering promotion and symbol recovery
        type: number
        required: false
        default: 90
      apple-bridge-selection:
        description: Approved candidate/source, configured Cloud workflow/product plus run/build, and immutable
          S3 version JSON
        type: string
        required: true
      asc-key-id:
        description: Existing App Store Connect API key identifier
        type: string
        required: true
      asc-issuer-id:
        description: Existing App Store Connect issuer identifier
        type: string
        required: true
    outputs:
      status:
        description: passed, advisory, or pending; only passed satisfies release gates
        value: ${{ jobs.run.outputs.status }}
      candidate-identity:
        description: candidate-identity
        value: ${{ jobs.run.outputs.candidate-identity }}
      source-sha:
        description: source-sha
        value: ${{ jobs.run.outputs.source-sha }}
      receipt-sha256:
        description: receipt-sha256
        value: ${{ jobs.run.outputs.receipt-sha256 }}
      state:
        description: Provider processing/review/availability state
        value: ${{ jobs.run.outputs.state }}
      candidate-manifest:
        description: Verified retained candidate manifest path
        value: ${{ jobs.run.outputs.candidate-manifest }}
      receipt-artifact-name:
        description: Exact uploaded receipt/state artifact name for authenticated reuse or retry
        value: ${{ jobs.run.outputs.receipt-artifact-name }}
      candidate-artifact-name:
        description: Exact uploaded candidate artifact name for downstream import
        value: ${{ jobs.run.outputs.candidate-artifact-name }}
      run-id:
        description: Producer run ID
        value: ${{ jobs.run.outputs.run-id }}
      run-attempt:
        description: Producer run attempt
        value: ${{ jobs.run.outputs.run-attempt }}
    secrets:
      ASC_PRIVATE_KEY_BASE64:
        description: Existing ASC private P8 key; materialized only in the import step
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      status: ${{ steps.execute.outputs.status }}
      candidate-identity: ${{ steps.package.outputs.candidate-identity || steps.execute.outputs.candidate-identity
        }}
      source-sha: ${{ steps.package.outputs.source-sha || steps.execute.outputs.source-sha }}
      receipt-sha256: ${{ steps.execute.outputs.receipt-sha256 }}
      state: ${{ steps.execute.outputs.state }}
      candidate-manifest: ${{ steps.package.outputs.manifest || steps.execute.outputs.manifest }}
      receipt-artifact-name: ${{ steps.retain-evidence.outcome == 'success' && format('{0}-run-{1}-attempt-{2}',
        inputs.artifact-name, github.run_id, github.run_attempt) || '' }}
      candidate-artifact-name: ${{ steps.retain-candidate.outcome == 'success' && format('{0}-candidate-run-{1}-attempt-{2}',
        inputs.artifact-name, github.run_id, github.run_attempt) || '' }}
      run-id: ${{ github.run_id }}
      run-attempt: ${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ inputs.python-version }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        package-manager-cache: false
        node-version: ${{ inputs.node-version }}
    - uses: $/actions/v2-setup
      with:
        binary-manifest: ${{ inputs.binary-manifest }}
        npm-tools: ${{ inputs.npm-tools }}
        ai-tools: 'false'
        python-tools: ${{ inputs.python-tools }}
        tool-bundles: ${{ inputs.tool-bundles }}
    - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: shared-ci-${{ github.run_id }}
    - id: execute
      uses: $/actions/v2-run
      with:
        config: ${{ inputs.config }}
        root: ${{ inputs.root }}
        credentials-config: ${{ inputs.credentials-config }}
        receipt-path: ${{ inputs.receipt-path }}
        module: apple_bridge
        operation: apple-import
        apple-bridge-selection: ${{ inputs.apple-bridge-selection }}
      env:
        ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        ASC_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_ISSUER_ID: ${{ inputs.asc-issuer-id }}
        BRIDGE_AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        BRIDGE_AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        BRIDGE_AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
    - name: Preserve sanitized evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: ${{ format('{0}-run-{1}-attempt-{2}', inputs.artifact-name, github.run_id, github.run_attempt) }}
        path: ${{ steps.execute.outputs.bundle }}
        if-no-files-found: error
        retention-days: ${{ inputs.receipt-retention-days }}
        include-hidden-files: false
      if: ${{ always() && steps.execute.outputs.bundle != '' }}
      id: retain-evidence
    - id: package
      if: ${{ steps.execute.outputs.status == 'passed' }}
      uses: $/actions/v2-artifacts
      with:
        operation: package
        root: ${{ inputs.root }}
        manifest: ${{ steps.execute.outputs.manifest }}
    - name: Retain exact candidate
      if: ${{ steps.execute.outputs.status == 'passed' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: ${{ format('{0}-candidate-run-{1}-attempt-{2}', inputs.artifact-name, github.run_id, github.run_attempt)
          }}
        path: ${{ steps.package.outputs.directory }}
        if-no-files-found: error
        include-hidden-files: true
        retention-days: ${{ inputs.candidate-retention-days }}
      id: retain-candidate
    environment: ${{ inputs.environment }}
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: apple-import-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
