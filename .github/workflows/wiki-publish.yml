name: Docs · Publish Wiki

'on':
  workflow_dispatch:
    inputs:
      source-directory:
        description: Reviewed Markdown page directory
        type: string
        default: docs/wiki
      adopt-existing-home:
        description: Replace the initial Home page on the first publication
        type: boolean
        default: false
  workflow_call:
    inputs:
      source-directory:
        description: Reviewed Markdown page directory
        type: string
        default: docs/wiki
      adopt-existing-home:
        description: Replace the initial Home page on the first publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Require a manual run on the default branch
      env:
        WIKI_EVENT: ${{ github.event_name }}
        WIKI_REF: ${{ github.ref }}
        WIKI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [[ "$WIKI_EVENT" != "workflow_dispatch" || "$WIKI_REF" != "refs/heads/$WIKI_DEFAULT_BRANCH" || -z "$WIKI_DEFAULT_BRANCH" ]]; then
          echo "Wiki publication requires a manual run on the repository default branch." >&2
          exit 1
        fi
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.3
    - uses: $/actions/v2-wiki
      with:
        source-directory: ${{ inputs.source-directory }}
        adopt-existing-home: ${{ inputs.adopt-existing-home }}
        github-token: ${{ github.token }}
