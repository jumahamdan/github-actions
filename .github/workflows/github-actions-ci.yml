name: Shared library validation
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.3
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.23.4
    - name: Install hash-locked test dependencies
      run: python3 -m pip install --require-hashes -r tooling/requirements-ci.txt
    - name: Install verified validation binaries
      run: 'python3 -m shared_ci.tools --manifest tooling/binaries.json --destination "$RUNNER_TEMP/shared-ci-tools"

        printf ''%s\n'' "$RUNNER_TEMP/shared-ci-tools" >> "$GITHUB_PATH"'
    - name: Validate workflow and action contracts
      run: python3 scripts/validate-workflows.py
    - name: Documentation links and facts
      run: python3 -m shared_ci.docs --config .ci/docs.json --root .
    - name: Compile Python modules
      run: python3 -m compileall -q shared_ci scripts
    - name: Whitespace checks
      run: git diff --check
    - name: Scan source for exposed secrets
      run: python3 -m shared_ci.security --config .ci/security.json --root . --output .ci-output/security.json
    - name: Audit locked AI tool dependencies
      run: npm audit --prefix tooling/ai --audit-level=high
  reusable-quality:
    uses: ./.github/workflows/v2-checks.yml
    with:
      config: .ci/quality.json
      profile: python
      artifact-name: library-quality
  mock-evaluation:
    uses: ./.github/workflows/v2-ai-mock.yml
    with:
      config: examples/ai-mock.json
      artifact-name: library-ai-mock
