# Named bindings fragments; regenerate workflows after editing.
execution:
  config: ${{ inputs.config }}
  root: ${{ inputs.root }}
  credentials-config: ${{ inputs.credentials-config }}
  receipt-path: ${{ inputs.receipt-path }}
selected-candidate:
