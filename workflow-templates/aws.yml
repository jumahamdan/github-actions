# Shared AWS deployment job; authentication mode is selected in workflows/v2-aws.yml.
deploy-job:
  runs-on: ubuntu-24.04
  timeout-minutes: 60
  outputs:
    $ref: outputs.job
  steps:
  - $ref: steps.checkout
  - $ref: steps.setup-python
  - $ref: steps.setup-node
  - $ref: steps.setup-tools
  - $ref: steps.import-candidate-trusted
  - $ref: steps.authenticate-aws
  - id: execute
    uses: $/actions/v2-run
    with:
      $merge:
      - $ref: bindings.execution
      - $ref: bindings.selected-candidate
      - module: deploy
        security-refresh: ${{ inputs.security-refresh }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      GH_TOKEN: ${{ secrets.ARTIFACT_READ_TOKEN || github.token }}
      GH_EVIDENCE_TOKEN: ${{ secrets.ARTIFACT_READ_TOKEN || github.token }}
  - $ref: steps.retain-evidence
  - $ref: steps.create-candidate
  - $ref: steps.package-candidate
  - $ref: steps.retain-candidate
  concurrency:
    group: aws-${{ github.repository }}-${{ inputs.environment }}
    cancel-in-progress: false
workflow-outputs:
  status:
    description: passed, advisory, or pending; only passed satisfies release gates
    value: ${{ jobs.run.outputs.status || jobs.branch.outputs.status }}
  candidate-identity:
    description: candidate-identity
    value: ${{ jobs.run.outputs.candidate-identity || jobs.branch.outputs.candidate-identity }}
  source-sha:
    description: source-sha
    value: ${{ jobs.run.outputs.source-sha || jobs.branch.outputs.source-sha }}
  receipt-sha256:
    description: receipt-sha256
    value: ${{ jobs.run.outputs.receipt-sha256 || jobs.branch.outputs.receipt-sha256 }}
  state:
    description: Provider processing/review/availability state
    value: ${{ jobs.run.outputs.state || jobs.branch.outputs.state }}
  candidate-manifest:
    description: Verified retained candidate manifest path
    value: ${{ jobs.run.outputs.candidate-manifest || jobs.branch.outputs.candidate-manifest }}
  receipt-artifact-name:
    description: Exact uploaded receipt/state artifact name for authenticated reuse or retry
    value: ${{ jobs.run.outputs.receipt-artifact-name || jobs.branch.outputs.receipt-artifact-name }}
  candidate-artifact-name:
    description: Exact uploaded candidate artifact name for downstream import
    value: ${{ jobs.run.outputs.candidate-artifact-name || jobs.branch.outputs.candidate-artifact-name }}
  run-id:
    description: Producer run ID
    value: ${{ jobs.run.outputs.run-id || jobs.branch.outputs.run-id }}
  run-attempt:
    description: Producer run attempt
    value: ${{ jobs.run.outputs.run-attempt || jobs.branch.outputs.run-attempt }}
