# Editable workflow source; shared definitions live one directory above.
name: Mobile · Android build
'on':
  workflow_call:
    inputs:
      $merge:
      - $ref: inputs.core
      - $ref: inputs.python-tools
      - $ref: inputs.execution
      - $ref: inputs.candidate-creation
      - $ref: inputs.candidate-import
      - $ref: inputs.tool-bundles
      - $ref: inputs.receipt-retention
      - $ref: inputs.language-versions
      - profile:
          description: Android build profile
          type: string
          required: false
          default: flutter
        environment:
          description: Configured GitHub environment
          type: string
          required: true
    outputs:
      $ref: outputs.workflow
    secrets:
      $merge:
      - $ref: secrets.artifact-read
      - ANDROID_KEYSTORE_BASE64:
          description: ANDROID_KEYSTORE_BASE64
          required: false
        ANDROID_STORE_PASSWORD:
          description: ANDROID_STORE_PASSWORD
          required: false
        ANDROID_KEY_PASSWORD:
          description: ANDROID_KEY_PASSWORD
          required: false
permissions:
  $ref: permissions.read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      $ref: outputs.job
    steps:
    - $ref: steps.checkout
    - $ref: steps.setup-python
    - $ref: steps.setup-node
    - $ref: steps.setup-java
    - $ref: steps.setup-selected-deno
    - $ref: steps.setup-selected-flutter
    - $ref: steps.setup-selected-php
    - $ref: steps.setup-tools
    - $ref: steps.import-candidate-trusted
    - id: execute
      uses: $/actions/v2-run
      with:
        $merge:
        - $ref: bindings.execution
        - $ref: bindings.selected-candidate
        - module: quality
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    - $ref: steps.retain-evidence
    - $ref: steps.create-candidate
    - $ref: steps.package-candidate
    - $ref: steps.retain-candidate
    environment: ${{ inputs.environment }}
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: mobile-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
