# Editable workflow source; shared definitions live one directory above.
name: Deploy · Web hosting
'on':
  workflow_call:
    inputs:
      $merge:
      - $ref: inputs.core
      - $ref: inputs.python-tools
      - $ref: inputs.execution
      - $ref: inputs.candidate-creation
      - $ref: inputs.candidate-import
      - $ref: inputs.tool-bundles
      - $ref: inputs.receipt-retention
      - $ref: inputs.security-refresh
      - $ref: inputs.environment-required
      - prior-deployment:
          description: Exact successful prior deployment receipt selector JSON for immutable provider promotion
          type: string
          required: false
          default: ''
    outputs:
      $ref: outputs.workflow
    secrets:
      $merge:
      - $ref: secrets.artifact-read
      - CLOUDFLARE_API_TOKEN:
          description: CLOUDFLARE_API_TOKEN
          required: false
        VERCEL_TOKEN:
          description: VERCEL_TOKEN
          required: false
        NETLIFY_AUTH_TOKEN:
          description: NETLIFY_AUTH_TOKEN
          required: false
permissions:
  $ref: permissions.read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      $ref: outputs.job
    steps:
    - $ref: steps.checkout
    - $ref: steps.setup-python
    - $ref: steps.setup-node
    - $ref: steps.setup-tools
    - $ref: steps.import-candidate-trusted
    - id: execute
      uses: $/actions/v2-run
      with:
        $merge:
        - $ref: bindings.execution
        - $ref: bindings.selected-candidate
        - module: deploy
          security-refresh: ${{ inputs.security-refresh }}
          prior-deployment: ${{ inputs.prior-deployment }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        GH_TOKEN: ${{ secrets.ARTIFACT_READ_TOKEN || github.token }}
        GH_EVIDENCE_TOKEN: ${{ secrets.ARTIFACT_READ_TOKEN || github.token }}
    - $ref: steps.retain-evidence
    - $ref: steps.create-candidate
    - $ref: steps.package-candidate
    - $ref: steps.retain-candidate
    environment: ${{ inputs.environment }}
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: web-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
