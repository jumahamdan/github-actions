# Editable workflow source; shared definitions live one directory above.
name: Deploy · AWS
'on':
  workflow_call:
    inputs:
      $merge:
      - $ref: inputs.core
      - $ref: inputs.python-tools
      - $ref: inputs.execution
      - $ref: inputs.candidate-creation
      - $ref: inputs.candidate-import
      - $ref: inputs.tool-bundles
      - $ref: inputs.receipt-retention
      - $ref: inputs.security-refresh
      - environment:
          description: Deployment target; also the GitHub environment when use-github-environment is true
          required: true
          type: string
        use-github-environment:
          description: Attach the job to a GitHub environment; disable for branch-scoped OIDC
          type: boolean
          default: true
      - $ref: inputs.aws-identity
    outputs:
      $ref: aws.workflow-outputs
    secrets:
      $ref: secrets.artifact-read
permissions:
  $ref: permissions.oidc
jobs:
  run:
    $merge:
    - $ref: aws.deploy-job
    - environment: ${{ inputs.environment }}
      if: ${{ inputs.use-github-environment && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
  branch:
    $merge:
    - $ref: aws.deploy-job
    - if: ${{ !inputs.use-github-environment && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
