# Editable workflow source; shared definitions live one directory above.
name: Mobile · Apple evidence import
'on':
  workflow_call:
    inputs:
      $merge:
      - $ref: inputs.core
      - $ref: inputs.python-tools
      - $ref: inputs.tool-bundles
      - $ref: inputs.receipt-retention
      - $ref: inputs.environment-required
      - $ref: inputs.aws-identity
      - $ref: inputs.receipt-path
      - credentials-config:
          description: Named credential contract relative to caller root
          type: string
          required: true
        candidate-retention-days:
          description: Retention covering promotion and symbol recovery
          type: number
          required: false
          default: 90
        apple-bridge-selection:
          description: Approved candidate/source, configured Cloud workflow/product plus run/build, and immutable
            S3 version JSON
          type: string
          required: true
        asc-key-id:
          description: Existing App Store Connect API key identifier
          type: string
          required: true
        asc-issuer-id:
          description: Existing App Store Connect issuer identifier
          type: string
          required: true
    outputs:
      $ref: outputs.workflow
    secrets:
      ASC_PRIVATE_KEY_BASE64:
        description: Existing ASC private P8 key; materialized only in the import step
        required: true
permissions:
  $ref: permissions.oidc
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      status: ${{ steps.execute.outputs.status }}
      candidate-identity: ${{ steps.package.outputs.candidate-identity || steps.execute.outputs.candidate-identity
        }}
      source-sha: ${{ steps.package.outputs.source-sha || steps.execute.outputs.source-sha }}
      receipt-sha256: ${{ steps.execute.outputs.receipt-sha256 }}
      state: ${{ steps.execute.outputs.state }}
      candidate-manifest: ${{ steps.package.outputs.manifest || steps.execute.outputs.manifest }}
      receipt-artifact-name: ${{ steps.retain-evidence.outcome == 'success' && format('{0}-run-{1}-attempt-{2}',
        inputs.artifact-name, github.run_id, github.run_attempt) || '' }}
      candidate-artifact-name: ${{ steps.retain-candidate.outcome == 'success' && format('{0}-candidate-run-{1}-attempt-{2}',
        inputs.artifact-name, github.run_id, github.run_attempt) || '' }}
      run-id: ${{ github.run_id }}
      run-attempt: ${{ github.run_attempt }}
    steps:
    - $ref: steps.checkout
    - $ref: steps.setup-python
    - $ref: steps.setup-node
    - $ref: steps.setup-tools
    - $ref: steps.authenticate-aws
    - id: execute
      uses: $/actions/v2-run
      with:
        $merge:
        - $ref: bindings.execution
        - module: apple_bridge
          operation: apple-import
          apple-bridge-selection: ${{ inputs.apple-bridge-selection }}
      env:
        ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        ASC_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_ISSUER_ID: ${{ inputs.asc-issuer-id }}
        BRIDGE_AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        BRIDGE_AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        BRIDGE_AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
    - $ref: steps.retain-evidence
    - id: package
      if: ${{ steps.execute.outputs.status == 'passed' }}
      uses: $/actions/v2-artifacts
      with:
        operation: package
        root: ${{ inputs.root }}
        manifest: ${{ steps.execute.outputs.manifest }}
    - name: Retain exact candidate
      if: ${{ steps.execute.outputs.status == 'passed' }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ format('{0}-candidate-run-{1}-attempt-{2}', inputs.artifact-name, github.run_id, github.run_attempt)
          }}
        path: ${{ steps.package.outputs.directory }}
        if-no-files-found: error
        include-hidden-files: true
        retention-days: ${{ inputs.candidate-retention-days }}
      id: retain-candidate
    environment: ${{ inputs.environment }}
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: apple-import-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
